<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Иван Иванов — визитка</title>
  <meta name="description" content="Иван Иванов — веб-разработчик и дизайнер.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e1b4b;
      --accent-1: #8b5cf6;
      --accent-2: #ec4899;
      --accent-3: #06b6d4;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
      overflow-x: hidden;
    }

    /* Плавающие цветные пятна на фоне */
    .blob {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: -1;
      animation: float 18s ease-in-out infinite;
    }
    .blob.one   { background: var(--accent-1); top: -120px; left: -100px; }
    .blob.two   { background: var(--accent-2); bottom: -140px; right: -120px; animation-delay: -6s; }
    .blob.three { background: var(--accent-3); top: 40%; left: 60%; width: 300px; height: 300px; animation-delay: -12s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 30px) scale(0.95); }
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 48px 32px 36px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
      animation: appear 0.8s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(from 180deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      animation: spin 8s linear infinite;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--bg-1);
      font-size: 2.4rem;
      font-weight: 800;
      animation: spin 8s linear infinite reverse; /* компенсирует вращение рамки */
      overflow: hidden;
    }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .role {
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .about {
      margin: 20px 0 32px;
      line-height: 1.65;
      color: var(--muted);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .socials a {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .socials a:hover,
    .socials a:focus-visible {
      transform: translateY(-4px);
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 12px 24px -8px var(--accent-2);
      outline: none;
    }
    .socials svg { width: 22px; height: 22px; fill: currentColor; }

    .email {
      display: inline-block;
      margin-top: 28px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px dashed var(--muted);
      transition: color 0.2s, border-color 0.2s;
    }
    .email:hover { color: var(--text); border-color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
