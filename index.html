<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>Танчики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f1;
      --panel: #ebebe6;
      --ink: #1a1a1a;
      --blue: #2f6bff;
      --red: #ff3b4e;
      --heat: #ff9f1a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      overflow: hidden; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

    .panel {
      flex: none; height: 132px; background: var(--panel);
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    }
    .panel.p2 { transform: rotate(180deg); padding-bottom: max(12px, env(safe-area-inset-top)); }
    .p1 { --c: var(--blue); }
    .p2 { --c: var(--red); }

    .pad {
      width: 100%; height: 100%; border: 0; border-radius: 22px; cursor: pointer; touch-action: none;
      background: var(--c); color: #fff; font: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      box-shadow: 0 5px 0 rgba(0,0,0,.18);
      transition: transform .06s, box-shadow .06s, filter .2s;
    }
    .pad.on { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
    .pad .name { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
    .pad .label { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
    .pad.hot { background: var(--heat); animation: blink .4s steps(2) infinite; }
    @keyframes blink { 50% { filter: brightness(1.15); } }

    .field { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; border-radius: 6px; }

    .overlay {
      position: fixed; inset: 0; z-index: 10; background: rgba(244,244,241,.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      animation: fade .3s ease;
    }
    @keyframes fade { from { opacity: 0; } }
    .win { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--c); text-align: center; }
    .win.flip { transform: rotate(180deg); }
    .again {
      font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--ink);
      border: 0; border-radius: 999px; height: 56px; padding: 0 32px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel p2"><button class="pad" data-p="1"><span class="name">Красный</span><span class="label">ЖМИ</span></button></div>
    <div class="field" id="field"><canvas id="cv"></canvas></div>
    <div class="panel p1"><button class="pad" data-p="0"><span class="name">Синий</span><span class="label">ЖМИ</span></button></div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="win flip" id="winTop"></div>
    <button class="again" id="again">Играть снова</button>
    <div class="win" id="winBot"></div>
  </div>

  <script>
    const W = 12, H = 16;
    const R = 0.4, SPEED = 3, TURN = Math.PI * 1.1;
    const BULLET_SPEED = 9, BULLET_R = 0.11;
    const HEAT_PER_SHOT = 0.3, HEAT_DECAY = 0.35, LOCK_TIME = 3, COUNTDOWN = 2.4;
    const PLAYERS = [
      { name: "Синий", color: "#2f6bff", dark: "#1c47b8" },
      { name: "Красный", color: "#ff3b4e", dark: "#b81f30" },
    ];
    const HEAT = "#ff9f1a";

    // bottom-half walls; each is mirrored by a 180° rotation so the map is fair
    const HALF = [
      { x: 1, y: 9.6, w: 3, h: 0.6 },
      { x: 8.4, y: 11.2, w: 0.6, h: 2.6 },
      { x: 2, y: 12.6, w: 2.4, h: 0.6 },
    ];
    const WALLS = [
      { x: 5, y: 7.4, w: 2, h: 1.2 },
      ...HALF,
      ...HALF.map(r => ({ x: W - r.x - r.w, y: H - r.y - r.h, w: r.w, h: r.h })),
    ];

    const $ = id => document.getElementById(id);
    let tanks, bullets, sparks, over, shake, countdown;

    function reset() {
      tanks = [
        { x: 6, y: 14.4, a: -Math.PI / 2, spin: 1, held: false, heat: 0, lock: 0, alive: true },
        { x: 6, y: 1.6, a: Math.PI / 2, spin: 1, held: false, heat: 0, lock: 0, alive: true },
      ];
      bullets = []; sparks = []; over = false; shake = 0; countdown = COUNTDOWN;
      document.querySelectorAll(".pad").forEach(b => b.classList.remove("on", "hot"));
      $("over").hidden = true;
    }

    /* ---------- input: one button per player ---------- */
    function press(p) {
      const t = tanks[p];
      if (t.held) return;
      t.held = true;
      if (!over && countdown <= 0 && t.lock <= 0) shoot(t, p);
    }
    function release(p) {
      const t = tanks[p];
      if (!t.held) return;
      t.held = false;
      t.spin = -t.spin;
    }

    document.querySelectorAll(".pad").forEach(btn => {
      const p = +btn.dataset.p;
      btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        btn.classList.add("on");
        press(p);
      });
      const end = () => { if (btn.classList.contains("on")) { btn.classList.remove("on"); release(p); } };
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointercancel", end);
      btn.addEventListener("lostpointercapture", end);
      btn.addEventListener("contextmenu", e => e.preventDefault());
    });

    const KEYS = { Space: 0, Enter: 1 };
    addEventListener("keydown", e => {
      if (!(e.code in KEYS) || e.repeat || !$("over").hidden) return;
      e.preventDefault(); press(KEYS[e.code]);
    });
    addEventListener("keyup", e => { if (e.code in KEYS) release(KEYS[e.code]); });

    /* ---------- physics ---------- */
    function circleHitsRect(x, y, r, w) {
      const cx = Math.max(w.x, Math.min(x, w.x + w.w)), cy = Math.max(w.y, Math.min(y, w.y + w.h));
      return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
    }
    function solid(x, y, r) {
      return x - r < 0 || y - r < 0 || x + r > W || y + r > H || WALLS.some(w => circleHitsRect(x, y, r, w));
    }
    function blocked(x, y, i) {
      const o = tanks[1 - i];
      return solid(x, y, R) || (o.alive && Math.hypot(o.x - x, o.y - y) < R * 2);
    }

    function shoot(t, i) {
      const bx = t.x + Math.cos(t.a) * (R + 0.2), by = t.y + Math.sin(t.a) * (R + 0.2);
      t.heat += HEAT_PER_SHOT;
      if (t.heat >= 1) { t.lock = LOCK_TIME; t.heat = 1; }
      if (solid(bx, by, BULLET_R)) return spark(bx, by, "#8a8a84");
      bullets.push({ x: bx, y: by, vx: Math.cos(t.a) * BULLET_SPEED, vy: Math.sin(t.a) * BULLET_SPEED, owner: i });
    }

    function spark(x, y, color, n = 6, power = 3) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * power;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, color, size: 3 + Math.random() * 4 });
      }
    }

    function destroy(i) {
      const t = tanks[i];
      t.alive = false; over = true; shake = 0.4;
      spark(t.x, t.y, PLAYERS[i].color, 26, 5);
      spark(t.x, t.y, HEAT, 12, 4);
      try { navigator.vibrate && navigator.vibrate(150); } catch {}
      setTimeout(() => showWinner(1 - i), 900);
    }

    function update(dt) {
      if (countdown > 0) countdown -= dt;
      const live = countdown <= 0 && !over;

      tanks.forEach((t, i) => {
        if (!t.alive) return;
        if (t.lock > 0) {
          t.lock -= dt;
          if (t.lock <= 0) { t.lock = 0; t.heat = 0; }
          return;
        }
        t.heat = Math.max(0, t.heat - HEAT_DECAY * dt);
        if (!live) return;
        if (t.held) {
          const dx = Math.cos(t.a) * SPEED * dt, dy = Math.sin(t.a) * SPEED * dt;
          if (!blocked(t.x + dx, t.y + dy, i)) { t.x += dx; t.y += dy; }
          else if (!blocked(t.x + dx, t.y, i)) t.x += dx;
          else if (!blocked(t.x, t.y + dy, i)) t.y += dy;
        } else {
          t.a += t.spin * TURN * dt;
        }
      });

      // substeps keep fast bullets from skipping through thin walls
      const steps = 4;
      for (let s = 0; s < steps; s++) {
        for (const b of bullets) {
          if (b.dead) continue;
          b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
          if (solid(b.x, b.y, BULLET_R)) { b.dead = true; spark(b.x, b.y, "#8a8a84"); continue; }
          tanks.forEach((t, i) => {
            if (b.dead || i === b.owner || !t.alive) return;
            if (Math.hypot(b.x - t.x, b.y - t.y) < R + BULLET_R) {
              b.dead = true;
              if (!over) destroy(i);
            }
          });
        }
        for (let a = 0; a < bullets.length; a++)
          for (let c = a + 1; c < bullets.length; c++) {
            const p = bullets[a], q = bullets[c];
            if (!p.dead && !q.dead && p.owner !== q.owner && Math.hypot(p.x - q.x, p.y - q.y) < BULLET_R * 2.5) {
              p.dead = q.dead = true; spark((p.x + q.x) / 2, (p.y + q.y) / 2, "#8a8a84", 8);
            }
          }
      }
      bullets = bullets.filter(b => !b.dead);

      sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.92; s.vy *= 0.92; s.life -= dt; });
      sparks = sparks.filter(s => s.life > 0);
      shake = Math.max(0, shake - dt);

      document.querySelectorAll(".pad").forEach(btn => {
        const t = tanks[+btn.dataset.p], hot = t.lock > 0;
        btn.classList.toggle("hot", hot);
        btn.querySelector(".label").textContent = hot ? `ПЕРЕГРЕВ ${Math.ceil(t.lock)}` : "ЖМИ";
      });
    }

    /* ---------- render ---------- */
    const cv = $("cv"), ctx = cv.getContext("2d");
    let U = 30;
    function resize() {
      const r = $("field").getBoundingClientRect();
      U = Math.max(8, Math.floor(Math.min((r.width - 16) / W, (r.height - 16) / H)));
      const dpr = window.devicePixelRatio || 1;
      cv.style.width = W * U + "px"; cv.style.height = H * U + "px";
      cv.width = W * U * dpr; cv.height = H * U * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);

    function rrect(x, y, w, h, r) {
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill();
    }

    function drawTank(t, i, now) {
      const P = PLAYERS[i], s = R * 2 * U;
      const locked = t.lock > 0, flash = locked && Math.floor(now / 150) % 2;

      if (t.heat > 0) {
        ctx.save();
        ctx.lineWidth = 4; ctx.lineCap = "round";
        if (locked) { ctx.shadowColor = HEAT; ctx.shadowBlur = 18; }
        ctx.strokeStyle = HEAT; ctx.globalAlpha = locked ? 1 : 0.85;
        const frac = locked ? t.lock / LOCK_TIME : t.heat;
        ctx.beginPath();
        ctx.arc(t.x * U, t.y * U, s * 0.78, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(t.x * U, t.y * U);
      ctx.rotate(t.a);
      ctx.fillStyle = flash ? HEAT : P.color;
      rrect(-s * 0.5, -s * 0.42, s, s * 0.84, s * 0.16);
      ctx.fillStyle = P.dark;
      rrect(0, -s * 0.09, s * 0.78, s * 0.18, s * 0.05);
      ctx.beginPath(); ctx.arc(0, 0, s * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function draw(now) {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W * U, H * U);

      ctx.strokeStyle = "#e6e6e0"; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(0, H / 2 * U); ctx.lineTo(W * U, H / 2 * U); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#d4d4cd";
      WALLS.forEach(w => rrect(w.x * U, w.y * U, w.w * U, w.h * U, Math.min(w.w, w.h) * U * 0.3));

      tanks.forEach((t, i) => t.alive && drawTank(t, i, now));

      bullets.forEach(b => {
        ctx.fillStyle = PLAYERS[b.owner].dark;
        ctx.beginPath(); ctx.arc(b.x * U, b.y * U, BULLET_R * U, 0, Math.PI * 2); ctx.fill();
      });

      sparks.forEach(s => {
        ctx.globalAlpha = Math.max(0, s.life / 0.5);
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x * U - s.size / 2, s.y * U - s.size / 2, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      if (countdown > 0) {
        ctx.fillStyle = "rgba(26,26,26,.85)";
        ctx.font = `800 ${U * 3}px Inter, system-ui, sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(Math.ceil(countdown / (COUNTDOWN / 3)), W / 2 * U, H / 2 * U);
      }
      ctx.restore();
    }

    function showWinner(i) {
      const P = PLAYERS[i], text = `${P.name} победил!`;
      ["winTop", "winBot"].forEach(id => { $(id).textContent = text; $(id).style.setProperty("--c", P.color); });
      $("over").hidden = false;
    }
    $("again").addEventListener("click", reset);

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw(now);
      requestAnimationFrame(loop);
    }

    reset();
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
