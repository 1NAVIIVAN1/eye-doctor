<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f1">
  <title>Zero Out</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f3f1;
      --surface: #ffffff;
      --ink: #161616;
      --muted: #9a9a96;
      --faint: #e2e2de;
      --accent: #ff5a36;
      --accent-ink: #ffffff;
      --accent-soft: rgba(255, 90, 54, 0.14);
      --ball: min(36vw, 21vh, 168px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131313;
        --surface: #1d1d1c;
        --ink: #f1f1ee;
        --muted: #6d6d69;
        --faint: #2c2c2a;
        --accent-soft: rgba(255, 90, 54, 0.2);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }

    /* top bar */
    .top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
    .coins { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); flex: none; }
    .coins.bump { animation: bump .35s ease; }
    @keyframes bump { 40% { transform: scale(1.12); } }
    .btn {
      font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
      background: var(--surface); border: 1px solid var(--faint); border-radius: 999px;
      height: 40px; padding: 0 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    .hint { text-align: center; color: var(--muted); font-size: 14px; height: 20px; margin-top: 6px; transition: opacity .3s; }

    /* balls */
    .field {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      place-items: center; min-height: 0;
    }
    .slot { position: relative; width: var(--ball); height: var(--ball); }
    .ball {
      position: absolute; inset: 0; border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--faint);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; touch-action: none;
      transition: transform .25s cubic-bezier(.3,1.4,.5,1), opacity .25s, border-color .2s, background .25s, box-shadow .3s;
      opacity: .5;
      will-change: transform;
    }
    .field.none-active .ball { opacity: 1; }
    .ball.active { opacity: 1; border-color: var(--accent); border-width: 3px; box-shadow: 0 0 0 8px var(--accent-soft); }
    .ball.ready {
      opacity: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
      box-shadow: 0 0 0 10px var(--accent-soft), 0 10px 40px rgba(255, 90, 54, .45);
      animation: glow 1.6s ease-in-out infinite; cursor: grab;
    }
    @keyframes glow { 50% { box-shadow: 0 0 0 16px var(--accent-soft), 0 10px 50px rgba(255, 90, 54, .6); } }
    .ball.dragging { transition: none; animation: none; z-index: 10; cursor: grabbing; }
    .ball.nudge { transition: none; }
    .ball.spawn { animation: spawn .4s cubic-bezier(.3,1.5,.5,1); }
    @keyframes spawn { from { transform: scale(0); opacity: 0; } }
    .num {
      font-size: calc(var(--ball) * 0.27); font-weight: 800; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .num.tick { animation: tick .18s ease; }
    @keyframes tick { 50% { transform: scale(1.08); } }
    .reward { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .reward::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .ball.ready .reward { color: var(--accent-ink); }
    .ball.ready .reward::before { background: var(--accent-ink); }
    .delta {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      font-size: 15px; font-weight: 700; color: var(--accent); pointer-events: none;
      animation: rise .6s ease forwards;
    }
    @keyframes rise { to { transform: translate(-50%, -26px); opacity: 0; } }

    /* step slider */
    .stepper { padding: 8px 4px 0; }
    .step-head { display: flex; align-items: baseline; justify-content: space-between; }
    .step-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
    .step-value { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; cursor: pointer; touch-action: pan-x; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--faint); }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--faint); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: var(--accent); border: 0; }
    input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 0; }
    input[type=range]:disabled { opacity: .5; cursor: default; }
    .ticks { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px; }
    .ticks span.on { color: var(--ink); }
    .ticks span.off { opacity: .45; }

    /* basket */
    .basket {
      margin-top: 14px; height: 92px; border-radius: 24px; flex: none;
      border: 2px dashed var(--faint); position: relative;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      color: var(--muted); font-size: 14px; font-weight: 600;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .basket svg { width: 34px; height: 34px; }
    .basket.armed { border-color: var(--accent); color: var(--accent); }
    .basket.over { background: var(--accent-soft); transform: scale(1.03); }
    .basket.land { animation: land .4s ease; }
    @keyframes land { 30% { transform: scaleY(.9) scaleX(1.04); } 60% { transform: scaleY(1.03); } }
    .pop {
      position: absolute; left: 50%; top: 0; transform: translate(-50%, -10px);
      font-size: 28px; font-weight: 800; color: var(--accent); pointer-events: none;
      animation: pop .9s cubic-bezier(.2,.8,.3,1) forwards;
    }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -24px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
    .splash { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); pointer-events: none; }

    /* upgrade sheet */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet {
      width: 100%; max-width: 480px; background: var(--surface); border-radius: 28px 28px 0 0;
      padding: 24px 16px max(24px, env(safe-area-inset-bottom)); animation: up .3s cubic-bezier(.2,.9,.3,1);
    }
    @keyframes up { from { transform: translateY(100%); } }
    .sheet h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .sheet p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .lvl { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--faint); }
    .lvl-step { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lvl-state { font-size: 14px; color: var(--muted); font-weight: 600; }
    .buy { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .buy:disabled { background: var(--faint); color: var(--muted); border-color: var(--faint); cursor: default; }
    .close { width: 100%; justify-content: center; margin-top: 12px; height: 48px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="top">
      <div class="coins" id="coins"><span class="coin"></span><span id="coinVal">0</span></div>
      <button class="btn" id="upBtn"><span class="dot" id="upDot" hidden></span>Прокачка</button>
    </div>
    <div class="hint" id="hint">Тапните шарик, свайпайте влево/вправо</div>

    <div class="field none-active" id="field"></div>

    <div class="stepper">
      <div class="step-head">
        <span class="step-label">Шаг</span>
        <span class="step-value" id="stepVal">0.1</span>
      </div>
      <input type="range" id="stepRange" min="0" max="0" step="1" value="0" aria-label="Шаг">
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="basket" id="basket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 11H5L3 9z"/><path d="M8 9l4-6 4 6"/></svg>
      <span>Корзина</span>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="sheet">
      <h2>Прокачка</h2>
      <p>Больший шаг — быстрее к нулю и крупнее числа.</p>
      <div id="levels"></div>
      <button class="btn close" id="closeBtn">Готово</button>
    </div>
  </div>

  <script>
    // all values are integer tenths: 25 === 2.5
    const STEPS = [1, 5, 10, 20, 50];
    const COSTS = [0, 40, 160, 550, 1800];
    const RANGE_CAP = [20, 60, 140, 300, 700];
    const SAVE_KEY = "zero-out-v1";

    const $ = id => document.getElementById(id);
    const field = $("field"), basket = $("basket"), range = $("stepRange");

    let state = load() || { coins: 0, level: 0, stepIdx: 0, dropped: 0, balls: [], active: -1 };
    while (state.balls.length < 4) state.balls.push(newBall());

    function load() {
      try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && Array.isArray(s.balls) ? s : null; }
      catch { return null; }
    }
    function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {} }

    function maxAbs() { return Math.min(RANGE_CAP[state.level], 10 + Math.floor(state.dropped * 1.5)); }
    function newBall() {
      const m = maxAbs();
      let v = 0;
      while (v === 0) v = Math.round((Math.random() * 2 - 1) * m);
      return { v, v0: v };
    }
    const reward = b => 1 + Math.floor(Math.abs(b.v0) * 0.3);
    const fmt = t => t === 0 ? "0" : (t > 0 ? "+" : "−") + (Math.abs(t) / 10).toFixed(1);
    const step = () => STEPS[state.stepIdx];

    /* ---------- render ---------- */
    const els = [];
    function buildField() {
      field.innerHTML = "";
      for (let i = 0; i < 4; i++) {
        const slot = document.createElement("div");
        slot.className = "slot";
        const ball = document.createElement("div");
        ball.className = "ball";
        ball.innerHTML = '<span class="num"></span><span class="reward"></span>';
        slot.appendChild(ball);
        field.appendChild(slot);
        els[i] = ball;
        bindBall(ball, i);
        renderBall(i);
      }
    }
    function renderBall(i) {
      const b = state.balls[i], el = els[i];
      el.querySelector(".num").textContent = fmt(b.v);
      el.querySelector(".reward").textContent = reward(b);
      el.classList.toggle("ready", b.v === 0);
      el.classList.toggle("active", i === state.active && b.v !== 0);
    }
    function renderAll() {
      state.balls.forEach((_, i) => renderBall(i));
      field.classList.toggle("none-active", state.active < 0 || state.balls[state.active].v === 0);
      $("coinVal").textContent = state.coins;
      range.max = state.level;
      range.value = state.stepIdx;
      range.disabled = state.level === 0;
      $("stepVal").textContent = (step() / 10).toFixed(1);
      $("ticks").innerHTML = STEPS.map((s, i) =>
        `<span class="${i === state.stepIdx ? "on" : i > state.level ? "off" : ""}">${(s / 10).toFixed(1)}</span>`).join("");
      $("upDot").hidden = !(state.level < STEPS.length - 1 && state.coins >= COSTS[state.level + 1]);
      basket.classList.toggle("armed", state.balls.some(b => b.v === 0));
      save();
    }
    function setHint(t) { $("hint").textContent = t; }

    /* ---------- actions ---------- */
    function select(i) {
      if (state.balls[i].v === 0) return;
      state.active = i;
      renderAll();
    }
    function apply(i, dir) {
      const b = state.balls[i];
      if (b.v === 0) return;
      state.active = i;
      b.v = Math.max(-9999, Math.min(9999, b.v + dir * step()));
      const num = els[i].querySelector(".num");
      num.classList.remove("tick"); void num.offsetWidth; num.classList.add("tick");
      const d = document.createElement("span");
      d.className = "delta";
      d.textContent = (dir > 0 ? "+" : "−") + (step() / 10).toFixed(1);
      els[i].parentElement.appendChild(d);
      setTimeout(() => d.remove(), 600);
      if (b.v === 0) setHint("Готово! Перетащите шарик в корзину");
      else setHint(b.v * b.v0 < 0 ? "Перелёт — вернитесь назад" : "Тапните шарик, свайпайте влево/вправо");
      renderAll();
    }

    /* ---------- pointer handling ---------- */
    function bindBall(el, i) {
      let sx, sy, mode = null, id = null;
      el.addEventListener("pointerdown", e => {
        if (el.classList.contains("falling")) return;
        id = e.pointerId; sx = e.clientX; sy = e.clientY;
        mode = state.balls[i].v === 0 ? "drag" : "swipe";
        el.setPointerCapture(id);
        el.classList.add(mode === "drag" ? "dragging" : "nudge");
      });
      el.addEventListener("pointermove", e => {
        if (e.pointerId !== id || !mode) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (mode === "drag") {
          el.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
          basket.classList.toggle("over", overBasket(e.clientX, e.clientY));
        } else {
          el.style.transform = `translateX(${Math.max(-28, Math.min(28, dx * 0.35))}px)`;
        }
      });
      const end = e => {
        if (e.pointerId !== id || !mode) return;
        const dx = e.clientX - sx, dy = e.clientY - sy, m = mode;
        mode = null; id = null;
        el.classList.remove("nudge");
        if (m === "drag") {
          basket.classList.remove("over");
          if (e.type === "pointerup" && overBasket(e.clientX, e.clientY)) return drop(i, dx, dy);
          el.classList.remove("dragging");
          el.style.transform = "";
          if (Math.hypot(dx, dy) < 8) setHint("Перетащите шарик в корзину");
          return;
        }
        el.style.transform = "";
        if (e.type !== "pointerup") return;
        if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) apply(i, dx > 0 ? 1 : -1);
        else if (Math.hypot(dx, dy) < 12) select(i);
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
    }
    function overBasket(x, y) {
      const r = basket.getBoundingClientRect();
      return x > r.left - 10 && x < r.right + 10 && y > r.top - 30 && y < r.bottom + 10;
    }

    /* ---------- drop with gravity ---------- */
    function drop(i, ox, oy) {
      const el = els[i], b = state.balls[i];
      el.classList.add("falling");
      const r = el.getBoundingClientRect(), br = basket.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const tx = br.left + br.width / 2 - cx, ty = br.top + br.height * 0.55 - cy;
      const T = 0.45, vy0 = -260, g = 2 * (ty - vy0 * T) / (T * T);
      const t0 = performance.now();
      (function frame(now) {
        const t = Math.min((now - t0) / 1000, T), k = t / T;
        const x = ox + tx * k, y = oy + vy0 * t + 0.5 * g * t * t;
        el.style.transform = `translate(${x}px, ${y}px) scale(${1.05 - 0.75 * k})`;
        if (t < T) return requestAnimationFrame(frame);
        land(i, reward(b));
      })(t0);
    }
    function land(i, coins) {
      const el = els[i];
      el.style.opacity = "0";
      basket.classList.remove("land"); void basket.offsetWidth; basket.classList.add("land");
      const p = document.createElement("div");
      p.className = "pop"; p.textContent = "+" + coins;
      basket.appendChild(p);
      setTimeout(() => p.remove(), 900);
      for (let k = 0; k < 8; k++) {
        const s = document.createElement("div");
        s.className = "splash";
        s.style.left = "50%"; s.style.top = "50%";
        basket.appendChild(s);
        const a = Math.PI + (k / 7) * Math.PI, d = 40 + Math.random() * 30;
        s.animate([{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
                   { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.3)`, opacity: 0 }],
                  { duration: 500, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
      }
      state.coins += coins;
      state.dropped++;
      const c = $("coins"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
      state.balls[i] = newBall();
      if (state.active === i) state.active = -1;
      setHint("Тапните шарик, свайпайте влево/вправо");
      setTimeout(() => {
        el.classList.remove("dragging", "falling", "spawn");
        el.style.transform = ""; el.style.opacity = "";
        void el.offsetWidth; el.classList.add("spawn");
      }, 250);
      renderAll();
    }

    /* ---------- step slider ---------- */
    range.addEventListener("input", () => {
      state.stepIdx = Math.min(+range.value, state.level);
      renderAll();
    });

    /* ---------- upgrades ---------- */
    function renderLevels() {
      $("levels").innerHTML = STEPS.map((s, i) => {
        const owned = i <= state.level, next = i === state.level + 1;
        const right = owned ? '<span class="lvl-state">Открыт</span>'
          : next ? `<button class="btn buy" data-i="${i}" ${state.coins < COSTS[i] ? "disabled" : ""}><span class="coin" style="width:10px;height:10px;background:currentColor"></span>${COSTS[i]}</button>`
          : `<span class="lvl-state">${COSTS[i]}</span>`;
        return `<div class="lvl"><span class="lvl-step" style="${owned || next ? "" : "opacity:.4"}">${(s / 10).toFixed(1)}</span>${right}</div>`;
      }).join("");
    }
    $("levels").addEventListener("click", e => {
      const btn = e.target.closest(".buy");
      if (!btn) return;
      const i = +btn.dataset.i;
      if (i !== state.level + 1 || state.coins < COSTS[i]) return;
      state.coins -= COSTS[i];
      state.level = i;
      state.stepIdx = i;
      renderAll(); renderLevels();
    });
    $("upBtn").addEventListener("click", () => { renderLevels(); $("scrim").hidden = false; });
    $("closeBtn").addEventListener("click", () => { $("scrim").hidden = true; });
    $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") $("scrim").hidden = true; });

    /* ---------- keyboard ---------- */
    document.addEventListener("keydown", e => {
      if (e.key >= "1" && e.key <= "4") select(+e.key - 1);
      if (state.active < 0) return;
      if (e.key === "ArrowRight") apply(state.active, 1);
      if (e.key === "ArrowLeft") apply(state.active, -1);
    });

    if (state.active >= 0 && state.balls[state.active].v === 0) state.active = -1;
    buildField();
    renderAll();
  </script>
</body>
</html>
