<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>Танчики</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f1;
      --panel: #ebebe6;
      --ink: #1a1a1a;
      --muted: #9b9b95;
      --btn: #ffffff;
      --blue: #2f6bff;
      --red: #ff3b4e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink);
      overflow: hidden; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

    .panel {
      flex: none; height: 176px; background: var(--panel);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px max(12px, env(safe-area-inset-bottom));
    }
    .panel.p2 { transform: rotate(180deg); padding-bottom: max(12px, env(safe-area-inset-top)); }

    .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 4px; }
    .dir {
      background: var(--btn); border: 0; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; touch-action: none;
      box-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .dir svg { width: 22px; height: 22px; fill: var(--ink); }
    .dir.on { background: var(--c); }
    .dir.on svg { fill: #fff; }
    .dir[data-d=up] { grid-area: 1 / 2; }
    .dir[data-d=left] { grid-area: 2 / 1; }
    .dir[data-d=right] { grid-area: 2 / 3; }
    .dir[data-d=down] { grid-area: 3 / 2; }

    .info { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .name { font-size: 14px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .1em; }
    .lives { display: flex; gap: 8px; }
    .life { width: 22px; height: 22px; border-radius: 6px; background: var(--c); transition: background .2s, transform .3s; }
    .life.lost { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); transform: scale(.8); }

    .fire {
      width: 92px; height: 92px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
      background: var(--c); color: #fff; font: inherit; font-size: 15px; font-weight: 800; letter-spacing: .06em;
      box-shadow: 0 4px 0 rgba(0,0,0,.18);
    }
    .fire.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }

    .p1 { --c: var(--blue); }
    .p2 { --c: var(--red); }

    .field { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
    canvas { display: block; border-radius: 6px; }

    .overlay {
      position: fixed; inset: 0; z-index: 10; background: rgba(244,244,241,.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      animation: fade .3s ease;
    }
    @keyframes fade { from { opacity: 0; } }
    .win { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--c); text-align: center; }
    .win.flip { transform: rotate(180deg); }
    .again {
      font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--ink);
      border: 0; border-radius: 999px; height: 56px; padding: 0 32px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel p2" data-p="1"></div>
    <div class="field" id="field"><canvas id="cv"></canvas></div>
    <div class="panel p1" data-p="0"></div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="win flip" id="winTop"></div>
    <button class="again" id="again">Играть снова</button>
    <div class="win" id="winBot"></div>
  </div>

  <script>
    const W = 12, H = 16;
    const TANK = 0.78, SPEED = 3.2, BULLET_SPEED = 10, BULLET_R = 0.12;
    const COOLDOWN = 0.35, MAX_BULLETS = 2, INVULN = 1.0, LIVES = 3;
    const PLAYERS = [
      { name: "Синий", color: "#2f6bff", dark: "#1c47b8" },
      { name: "Красный", color: "#ff3b4e", dark: "#b81f30" },
    ];
    const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const ANGLE = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 };
    // player 2 sits opposite, so their local directions are rotated 180° on screen
    const FLIP = { up: "down", down: "up", left: "right", right: "left" };

    // bottom half (rows 8..15); top half is the 180° rotation for a fair map
    const BOTTOM = [
      "....#..#....",
      ".##......##.",
      ".#...##...#.",
      "............",
      "...#....#...",
      "..#......#..",
      "............",
      "............",
    ];
    const MAP = [...BOTTOM.map(r => [...r].reverse().join("")).reverse(), ...BOTTOM];
    const wall = (cx, cy) => cx < 0 || cy < 0 || cx >= W || cy >= H || MAP[cy][cx] === "#";

    let tanks, bullets, sparks, over, shake;

    function reset() {
      tanks = [
        { x: 6, y: 14.5, dir: "up", lives: LIVES, cool: 0, inv: 0, held: [], fire: false },
        { x: 6, y: 1.5, dir: "down", lives: LIVES, cool: 0, inv: 0, held: [], fire: false },
      ];
      bullets = []; sparks = []; over = false; shake = 0;
      document.querySelectorAll(".on").forEach(b => b.classList.remove("on"));
      $("over").hidden = true;
      renderLives();
    }
    const $ = id => document.getElementById(id);

    /* ---------- controls ---------- */
    const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z"/></svg>';
    const ROT = { up: 0, right: 90, down: 180, left: 270 };
    document.querySelectorAll(".panel").forEach(panel => {
      const p = +panel.dataset.p;
      panel.innerHTML = `
        <div class="dpad">${["up", "left", "right", "down"].map(d =>
          `<button class="dir" data-d="${d}" aria-label="${d}">${ARROW}</button>`).join("")}</div>
        <div class="info"><div class="name">${PLAYERS[p].name}</div><div class="lives">${'<span class="life"></span>'.repeat(LIVES)}</div></div>
        <button class="fire" aria-label="Огонь">ОГОНЬ</button>`;
      panel.querySelectorAll(".dir").forEach(btn => {
        btn.querySelector("svg").style.transform = `rotate(${ROT[btn.dataset.d]}deg)`;
        const d = p === 1 ? FLIP[btn.dataset.d] : btn.dataset.d;
        hold(btn, () => press(p, d), () => release(p, d));
      });
      hold(panel.querySelector(".fire"), () => { tanks[p].fire = true; }, () => { tanks[p].fire = false; });
    });

    function hold(btn, down, up) {
      btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        btn.classList.add("on");
        down();
      });
      const end = () => { if (btn.classList.contains("on")) { btn.classList.remove("on"); up(); } };
      btn.addEventListener("pointerup", end);
      btn.addEventListener("pointercancel", end);
      btn.addEventListener("lostpointercapture", end);
      btn.addEventListener("contextmenu", e => e.preventDefault());
    }
    function press(p, d) { const h = tanks[p].held; if (!h.includes(d)) h.push(d); }
    function release(p, d) { const h = tanks[p].held, i = h.indexOf(d); if (i >= 0) h.splice(i, 1); }

    const KEYS = {
      KeyW: [0, "up"], KeyS: [0, "down"], KeyA: [0, "left"], KeyD: [0, "right"], Space: [0, "fire"],
      ArrowUp: [1, "up"], ArrowDown: [1, "down"], ArrowLeft: [1, "left"], ArrowRight: [1, "right"], Enter: [1, "fire"],
    };
    addEventListener("keydown", e => {
      const k = KEYS[e.code]; if (!k || e.repeat) return;
      e.preventDefault();
      k[1] === "fire" ? (tanks[k[0]].fire = true) : press(k[0], k[1]);
    });
    addEventListener("keyup", e => {
      const k = KEYS[e.code]; if (!k) return;
      k[1] === "fire" ? (tanks[k[0]].fire = false) : release(k[0], k[1]);
    });

    /* ---------- physics ---------- */
    function blocked(x, y, self) {
      const h = TANK / 2;
      if (x - h < 0 || y - h < 0 || x + h > W || y + h > H) return true;
      for (let cy = Math.floor(y - h); cy <= Math.floor(y + h - 1e-6); cy++)
        for (let cx = Math.floor(x - h); cx <= Math.floor(x + h - 1e-6); cx++)
          if (wall(cx, cy)) return true;
      const o = tanks[1 - self];
      return Math.abs(o.x - x) < TANK && Math.abs(o.y - y) < TANK;
    }

    function moveTank(t, i, dt) {
      const d = t.held[t.held.length - 1];
      if (!d) return;
      t.dir = d;
      const [vx, vy] = VEC[d], s = SPEED * dt;
      const nx = t.x + vx * s, ny = t.y + vy * s;
      if (!blocked(nx, ny, i)) { t.x = nx; t.y = ny; return; }
      // corner assist: slide toward the lane center so 1-cell gaps are easy to enter
      if (vx) {
        const c = Math.floor(t.y) + 0.5, off = c - t.y;
        if (Math.abs(off) > 1e-3 && Math.abs(off) < 0.42 && !blocked(t.x, t.y + Math.sign(off) * Math.min(s, Math.abs(off)), i))
          t.y += Math.sign(off) * Math.min(s, Math.abs(off));
      } else {
        const c = Math.floor(t.x) + 0.5, off = c - t.x;
        if (Math.abs(off) > 1e-3 && Math.abs(off) < 0.42 && !blocked(t.x + Math.sign(off) * Math.min(s, Math.abs(off)), t.y, i))
          t.x += Math.sign(off) * Math.min(s, Math.abs(off));
      }
    }

    function shoot(t, i) {
      if (t.cool > 0 || bullets.filter(b => b.owner === i).length >= MAX_BULLETS) return;
      t.cool = COOLDOWN;
      const [vx, vy] = VEC[t.dir];
      const bx = t.x + vx * 0.55, by = t.y + vy * 0.55;
      if (wall(Math.floor(bx), Math.floor(by))) return spark(bx, by, PLAYERS[i].color);
      bullets.push({ x: bx, y: by, vx: vx * BULLET_SPEED, vy: vy * BULLET_SPEED, owner: i });
    }

    function spark(x, y, color, n = 6) {
      for (let k = 0; k < n; k++) {
        const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35, color });
      }
    }

    function hit(i, b) {
      const t = tanks[i];
      t.lives--; t.inv = INVULN; shake = 0.25;
      spark(b.x, b.y, PLAYERS[i].color, 14);
      try { navigator.vibrate && navigator.vibrate(80); } catch {}
      renderLives();
      if (t.lives <= 0) {
        over = true;
        setTimeout(() => showWinner(1 - i), 700);
      }
    }

    function update(dt) {
      tanks.forEach((t, i) => {
        t.cool = Math.max(0, t.cool - dt);
        t.inv = Math.max(0, t.inv - dt);
        if (over) return;
        moveTank(t, i, dt);
        if (t.fire) shoot(t, i);
      });

      // substep bullets so fast shots never tunnel through a wall
      const steps = 4;
      for (let s = 0; s < steps; s++) {
        for (const b of bullets) {
          if (b.dead) continue;
          b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
          if (wall(Math.floor(b.x), Math.floor(b.y))) { b.dead = true; spark(b.x, b.y, "#8a8a84"); continue; }
          tanks.forEach((t, i) => {
            if (b.dead || i === b.owner || t.lives <= 0) return;
            const h = TANK / 2 + BULLET_R;
            if (Math.abs(b.x - t.x) < h && Math.abs(b.y - t.y) < h) {
              b.dead = true;
              if (t.inv <= 0 && !over) hit(i, b); else spark(b.x, b.y, "#8a8a84");
            }
          });
        }
        for (let a = 0; a < bullets.length; a++)
          for (let c = a + 1; c < bullets.length; c++) {
            const p = bullets[a], q = bullets[c];
            if (!p.dead && !q.dead && p.owner !== q.owner && Math.hypot(p.x - q.x, p.y - q.y) < BULLET_R * 2.5) {
              p.dead = q.dead = true; spark((p.x + q.x) / 2, (p.y + q.y) / 2, "#8a8a84", 8);
            }
          }
      }
      bullets = bullets.filter(b => !b.dead);

      sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; });
      sparks = sparks.filter(s => s.life > 0);
      shake = Math.max(0, shake - dt);
    }

    /* ---------- render ---------- */
    const cv = $("cv"), ctx = cv.getContext("2d");
    let U = 30;
    function resize() {
      const r = $("field").getBoundingClientRect();
      U = Math.max(8, Math.floor(Math.min((r.width - 16) / W, (r.height - 16) / H)));
      const dpr = window.devicePixelRatio || 1;
      cv.style.width = W * U + "px"; cv.style.height = H * U + "px";
      cv.width = W * U * dpr; cv.height = H * U * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);

    function rrect(x, y, w, h, r) {
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill();
    }

    function draw() {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - .5) * shake * 16, (Math.random() - .5) * shake * 16);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W * U, H * U);

      ctx.strokeStyle = "#e6e6e0"; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(0, H / 2 * U); ctx.lineTo(W * U, H / 2 * U); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#d4d4cd";
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
        if (MAP[y][x] === "#") rrect(x * U + 1.5, y * U + 1.5, U - 3, U - 3, U * 0.18);

      tanks.forEach((t, i) => {
        if (t.lives <= 0) { ctx.globalAlpha = 0.25; }
        else if (t.inv > 0 && Math.floor(t.inv * 12) % 2) return;
        const P = PLAYERS[i], s = TANK * U;
        ctx.save();
        ctx.translate(t.x * U, t.y * U);
        ctx.rotate(ANGLE[t.dir]);
        ctx.fillStyle = P.color; rrect(-s / 2, -s / 2, s, s, s * 0.18);
        ctx.fillStyle = P.dark;
        rrect(0, -s * 0.09, s * 0.72, s * 0.18, s * 0.05);
        ctx.beginPath(); ctx.arc(0, 0, s * 0.26, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      });

      bullets.forEach(b => {
        ctx.fillStyle = PLAYERS[b.owner].dark;
        ctx.beginPath(); ctx.arc(b.x * U, b.y * U, BULLET_R * U, 0, Math.PI * 2); ctx.fill();
      });

      sparks.forEach(s => {
        ctx.globalAlpha = Math.max(0, s.life / 0.35);
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x * U - 2, s.y * U - 2, 4, 4);
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function renderLives() {
      document.querySelectorAll(".panel").forEach(panel => {
        const t = tanks[+panel.dataset.p];
        panel.querySelectorAll(".life").forEach((el, k) => el.classList.toggle("lost", k >= t.lives));
      });
    }

    function showWinner(i) {
      const P = PLAYERS[i], text = `${P.name} победил!`;
      ["winTop", "winBot"].forEach(id => { $(id).textContent = text; $(id).style.setProperty("--c", P.color); });
      $("over").hidden = false;
    }
    $("again").addEventListener("click", reset);

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
